apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: evaluation-runtime-config
  namespace: toggle-prod
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: evaluation-runtime-config
    creationPolicy: Owner

  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: tech-challenge/evaluation-config
        property: REDIS_URL

    - secretKey: AWS_SQS_URL
      remoteRef:
        key: tech-challenge/evaluation-config
        property: AWS_SQS_URL

    - secretKey: AWS_REGION
      remoteRef:
        key: tech-challenge/evaluation-config
        property: AWS_REGION