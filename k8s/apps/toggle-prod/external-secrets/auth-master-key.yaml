apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: auth-master-key
  namespace: toggle-prod
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore

  target:
    name: auth-master-key
    creationPolicy: Owner

  data:
    - secretKey: MASTER_KEY
      remoteRef:
        key: tech-challenge/auth-master-key
        property: MASTER_KEY